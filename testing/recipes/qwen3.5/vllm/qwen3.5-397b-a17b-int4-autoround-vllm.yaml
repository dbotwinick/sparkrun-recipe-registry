model: Intel/Qwen3.5-397B-A17B-int4-AutoRound
runtime: vllm
min_nodes: 2
container: vllm-node-tf5

metadata:
  description: Qwen3.5 397B A17B (Intel INT4 AutoRound quant) VLLM

mods:
  - mods/fix-qwen3.5-autoround
  - mods/fix-qwen3.5-chat-template
  - mods/gpu-mem-util-gb

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  max_model_len: 131072
  max_num_seqs: 2
  gpu_memory_utilization_gb: 105
  served_model_name: qwen3.5-35b
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
  max_num_batched_tokens: 8192
  kv_cache_dtype: fp8

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve \
      {model} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --gpu-memory-utilization-gb {gpu_memory_utilization_gb} \
      --port {port}   \
      --host {host} \
      --enable-prefix-caching \
      --enable-auto-tool-choice \
      --tool-call-parser {tool_call_parser} \
      --reasoning-parser {reasoning_parser} \
      --trust-remote-code \
      --chat-template unsloth.jinja \
      -tp {tensor_parallel} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --kv-cache-dtype {kv_cache_dtype} \
      --distributed-executor-backend ray \
      --language-model-only