model: unsloth/Qwen3.5-122B-A10B-GGUF:Q4_K_M
runtime: llama-cpp
min_nodes: 1
container: scitrera/dgx-spark-llama-cpp:b8192-cu131

metadata:
  description: Qwen3.5 122B (GGUF, unsloth quant, Q4_K_M)
  maintainer: scitrera.ai <open-source-team@scitrera.com>
  model_params: 122B
  model_dtype: q4_k_m

defaults:
  port: 8000
  host: 0.0.0.0
  n_gpu_layers: 99
  ctx_size: 262144
  split_mode: layer

command: |
  llama-server \
      -hf {model} \
      --host {host} \
      --port {port} \
      --n-gpu-layers {n_gpu_layers} \
      --ctx-size {ctx_size} \
      --flash-attn on \
      --jinja \
      --split-mode {split_mode} \
      --no-webui \
      --no-mmap
