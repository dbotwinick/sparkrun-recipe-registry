model: unsloth/Qwen3.5-397B-A17B-GGUF:Q3_K_M
runtime: llama-cpp
min_nodes: 2
container: scitrera/dgx-spark-llama-cpp:b8192-cu131

metadata:
  description: Qwen3.5 397B (GGUF, unsloth quant, Q3_K_M)
  maintainer: scitrera.ai <open-source-team@scitrera.com>
  model_params: 397B
  model_dtype: q3_k_m

defaults:
  port: 8000
  host: 0.0.0.0
  max_model_len: 262144
  tensor_parallel: 1
  n_gpu_layers: 99

benchmark:
  tokenizer: Qwen/Qwen3.5-122B-A10B

command: |
  llama-server \
      -hf {model} \
      --host {host} \
      --port {port} \
      --n-gpu-layers {n_gpu_layers} \
      --ctx-size {max_model_len} \
      --flash-attn on \
      --jinja \
      --no-webui \
      --no-mmap
